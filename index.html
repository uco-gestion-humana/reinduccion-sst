<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guardianes de la Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one centered stage (max 900px) under a sticky HUD. Answers are chunky 2x2 tiles that stack on phones; color AND shape identify each answer. */
:root{
  color-scheme:light;
  --bg:#f3eee2; --surface:#fffcf4; --ink:#10301f; --muted:#56695c; --line:#dcd3bd;
  --accent:#0f7a4c; --accent-ink:#ffffff; --shadow:rgba(16,48,31,.16);
  --a1:#0f7a4c; --a1t:#ffffff; --a2:#f5b700; --a2t:#221a00; --a3:#0f7fa6; --a3t:#ffffff; --a4:#8a2a3b; --a4t:#ffffff;
  --ok:#157a45; --bad:#b3372a; --okbg:#e0f3e6; --badbg:#fbe5e1;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a13; --surface:#14271d; --ink:#eaf2e6; --muted:#9bb2a2; --line:#27402f;
    --accent:#3cc189; --accent-ink:#04140b; --shadow:rgba(0,0,0,.5);
    --a1:#3cc189; --a1t:#04140b; --a2:#ffc928; --a2t:#201700; --a3:#4bbbe0; --a3t:#03171f; --a4:#e57d90; --a4t:#2a0610;
    --ok:#5fe0a0; --bad:#ff8f80; --okbg:#12392a; --badbg:#3a1b1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a13; --surface:#14271d; --ink:#eaf2e6; --muted:#9bb2a2; --line:#27402f;
  --accent:#3cc189; --accent-ink:#04140b; --shadow:rgba(0,0,0,.5);
  --a1:#3cc189; --a1t:#04140b; --a2:#ffc928; --a2t:#201700; --a3:#4bbbe0; --a3t:#03171f; --a4:#e57d90; --a4t:#2a0610;
  --ok:#5fe0a0; --bad:#ff8f80; --okbg:#12392a; --badbg:#3a1b1a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a3);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;min-width:0}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.segs{display:flex;gap:5px;flex:1 1 220px;min-width:0}
.seg{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;border-radius:99px;transition:width .4s}
.score{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.score small{font:600 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.streak{background:var(--a2);color:var(--a2t);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:99px;animation:pop .35s}
.snd{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.snd[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.topbar{display:flex;justify-content:flex-end;padding-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:1.05rem;padding:14px 28px;border-radius:16px;box-shadow:0 5px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.big{font-size:1.25rem;padding:18px 40px;border-radius:20px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}

#stage{padding-top:24px}

/* Intro */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,44px);align-items:center}
.hero-art{border-radius:32px;overflow:hidden;background:#f1ece4;box-shadow:0 14px 40px var(--shadow);transform:rotate(-1.5deg)}
.hero-art img{display:block;width:100%;height:auto}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.hero h1{font-size:clamp(2.8rem,8vw,5rem);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--a1)}
.lede{margin:16px 0 22px;font-size:1.1rem;max-width:46ch}
.form{display:flex;flex-direction:column;gap:14px;max-width:420px}
.form label.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.form input[type=text]{width:100%;font:600 1.15rem var(--f-body);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.form input[type=text]:focus{border-color:var(--a3);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--muted);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.best{font-size:.92rem;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:44px 0 8px}
.how div{display:flex;gap:12px;align-items:flex-start}
.how svg{width:30px;height:30px;flex:none}
.how b{display:block;font-family:var(--f-display);font-size:1.1rem}
.how span{font-size:.92rem;color:var(--muted)}
.rank-card{margin-top:36px;background:var(--surface);border-radius:24px;padding:22px clamp(16px,3vw,28px);box-shadow:0 6px 24px var(--shadow)}
.rank-card h2{font-size:1.6rem;margin-bottom:12px}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--bg)}
.rk li.me{outline:2px solid var(--a2)}
.rk .pos{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--muted)}
.rk li:nth-child(1) .pos{color:var(--a2)}
.rk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .pt{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.rk-msg{color:var(--muted);font-size:.95rem}

/* Round intro */
.rintro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:clamp(12px,4vw,36px) 0}
.rintro .badge{width:150px;height:150px;border-radius:44% 56% 52% 48% / 52% 44% 56% 48%;background:var(--c);color:var(--ct);display:grid;place-items:center;align-content:center;animation:pop .5s;box-shadow:0 10px 0 var(--shadow)}
.rintro .badge b{font-family:var(--f-display);font-size:4.4rem;line-height:.9;font-weight:800}
.rintro .badge small{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.rintro h2{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin-top:10px}
.rintro .topic{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rintro .blurb{font-size:1.15rem;max-width:42ch}
.rintro .mech{color:var(--muted);margin-bottom:10px}

/* Challenge */
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--c);color:var(--ct);font-weight:700;font-size:.82rem;padding:4px 12px;border-radius:99px}
.count{color:var(--muted);font-size:.9rem;font-weight:600}
.clock{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.calm-note{margin-left:auto;color:var(--muted);font-size:.9rem;font-weight:600}
.tbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;border-radius:99px}
.tbar i.low{background:var(--bad)}
.q{font-size:clamp(1.55rem,4.4vw,2.5rem);font-weight:800;letter-spacing:-.015em;line-height:1.12;margin:6px 0 24px;max-width:28ch}
.q.wide{max-width:34ch}
.opts{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.n2 .opt{min-height:110px;justify-content:center;font-size:1.4rem}
.opt{--c:var(--a1);--ct:var(--a1t);display:flex;align-items:center;gap:14px;min-height:88px;border:0;border-radius:20px;padding:16px 18px;background:var(--c);color:var(--ct);
  text-align:left;font-weight:700;font-size:clamp(1rem,2.3vw,1.2rem);line-height:1.25;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s,opacity .2s;position:relative}
.opt.o2{--c:var(--a2);--ct:var(--a2t)} .opt.o3{--c:var(--a3);--ct:var(--a3t)} .opt.o4{--c:var(--a4);--ct:var(--a4t)}
.opt svg{width:30px;height:30px;flex:none;fill:currentColor}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:not(:disabled):hover{transform:translateY(-3px)}
.opt:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.3}
.opt.ok{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ok);animation:pop .4s}
.opt.bad{animation:shake .4s;opacity:.75}
.opt.ok::after,.opt.bad::after{position:absolute;right:14px;top:10px;font-weight:800;font-size:1.3rem}
.opt.ok::after{content:"✓"} .opt.bad::after{content:"✗"}

/* Order game */
.order{display:flex;flex-direction:column;gap:18px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:12px;align-items:center;min-height:54px;padding:8px 14px 8px 8px;border-radius:16px;border:2px dashed var(--line);color:var(--muted)}
.slot b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--line);font-family:var(--f-display);flex:none;color:var(--ink)}
.slot.full{border:2px solid var(--ok);background:var(--okbg);color:var(--ink);font-weight:600;animation:pop .3s}
.slot.full b{background:var(--ok);color:var(--bg)}
.slot span{min-width:0;overflow-wrap:anywhere}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.card{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;text-align:left;max-width:100%;box-shadow:0 4px 0 var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--a3)}
.card.shake{animation:shake .4s;border-color:var(--bad)}
.misses{color:var(--muted);font-size:.9rem;min-height:1.4em}

/* Reveal */
.reveal{margin-top:22px;border-radius:22px;padding:18px clamp(16px,3vw,24px) 22px;background:var(--okbg);animation:rise .35s}
.reveal.miss{background:var(--badbg)}
.rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rv-top strong{font-family:var(--f-display);font-size:1.8rem;font-weight:800}
.reveal.good .rv-top strong{color:var(--ok)} .reveal.miss .rv-top strong{color:var(--bad)}
.pts{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.bonus{font-size:.9rem;font-weight:700;color:var(--muted)}
.answer-line{margin-top:6px;font-weight:700}
.why{margin:8px 0 16px;max-width:60ch}
.why::before{content:"Para recordar · ";font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}

/* End */
.end{display:flex;flex-direction:column;gap:30px}
.end-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.end-top .lvl{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.end-top h2{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.025em}
.big-score{font-family:var(--f-display);font-weight:800;font-size:clamp(3.5rem,14vw,7rem);line-height:1;color:var(--a1);font-variant-numeric:tabular-nums}
.end-top p.msg{max-width:46ch;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border-radius:18px;padding:14px 16px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);font-weight:600}
.rounds{display:flex;flex-direction:column;gap:12px}
.rounds h3,.end h3{font-size:1.5rem}
.rrow{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.rrow .rn{font-weight:700;font-size:.95rem}
.rbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px}
.rrow .rf{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.review{font-weight:600;padding:12px 16px;border-radius:14px;background:var(--surface);border-left:6px solid var(--a2)}
.eval{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:center;background:var(--surface);border-radius:24px;padding:24px clamp(16px,3vw,30px);box-shadow:0 6px 24px var(--shadow)}
.eval h3{font-size:1.7rem;margin-bottom:8px}
.eval img{width:100%;height:auto;border-radius:14px;display:block;background:#fff}
.adminbar{margin-top:20px;display:flex;justify-content:flex-end}
.end-actions{display:flex;gap:12px;flex-wrap:wrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* New challenge types */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sortcard{background:var(--surface);border-radius:22px;padding:22px 20px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-bottom:16px;box-shadow:0 6px 24px var(--shadow)}
.sortcard small{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sortcard b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,4vw,2.1rem);line-height:1.15}
.sortcard.pop{animation:rise .25s}
.sortcard.shake{animation:shake .4s}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,3vw,28px)}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mbtn{--c:var(--surface);--ct:var(--ink);border:2px solid var(--line);background:var(--c);color:var(--ct);border-radius:16px;padding:12px 14px;min-height:64px;font-weight:700;font-size:clamp(.88rem,2.2vw,1.05rem);line-height:1.25;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .12s;overflow-wrap:anywhere}
.mbtn:not(:disabled):hover{transform:translateY(-2px);border-color:var(--a3)}
.mbtn.sel{border-color:var(--a2);box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--a2)}
.mbtn.got{border-color:transparent;box-shadow:none}
.mbtn:disabled{cursor:default}
.mbtn.shake{animation:shake .4s;border-color:var(--bad)}
.cloze{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,4.4vw,2.2rem);line-height:1.7;margin:4px 0 12px}
.blank{display:inline-block;min-width:5.5ch;padding:0 .35em;margin:0 .1em;border-bottom:4px dashed var(--line);text-align:center;color:var(--ok);font-weight:800}
.blank.cur{border-bottom-color:var(--a2)}
.blank.full{border-bottom:4px solid var(--ok)}
.scene{border-radius:20px;overflow:hidden;box-shadow:0 8px 28px var(--shadow);background:#efe6d0}
.scene svg{display:block;width:100%;height:auto}
.hz{cursor:pointer}
.hz:focus-visible{outline:3px solid #0f7fa6;outline-offset:-3px}
.found{margin:14px 0 6px;font-weight:700}
.found b{font-family:var(--f-display);font-size:1.4rem;color:var(--ok)}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{padding:8px 12px;border-radius:12px;background:var(--okbg);font-size:.95rem;animation:rise .3s}
.typef{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.typef input{flex:1 1 200px;min-width:0;font:700 1.6rem var(--f-display);padding:14px 18px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:.02em}
.typef input:focus{border-color:var(--a3);outline:none}
.typef input.shake{animation:shake .4s;border-color:var(--bad)}
.qr-ph{width:200px;max-width:100%;aspect-ratio:1/1;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-weight:600}

/* Admin panel */
.adm{display:flex;flex-direction:column;gap:18px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adm-top h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
.adm-h{font-size:1.4rem;margin-top:10px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 3.4rem;gap:4px 12px;background:var(--surface);border-radius:16px;padding:12px 16px;align-items:center}
.qtxt{grid-column:1/-1;font-weight:700}
.qmeta{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.qrow .rf{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.qwrong{grid-column:1/-1;font-size:.88rem;color:var(--bad);font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.person{background:var(--surface);border-radius:16px;padding:12px 16px}
.person summary{cursor:pointer;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.person summary b{font-family:var(--f-display);font-size:1.1rem}
.pstate{font-size:.85rem;color:var(--muted);font-weight:600}
.pscore{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.alog{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.alog li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.alog .mark{font-weight:800;width:1.2em;flex:none}
.alog li.yes .mark{color:var(--ok)} .alog li.no .mark{color:var(--bad)}
.alog .at{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.alog em{font-style:normal;color:var(--muted)}

@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:700px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:420px}
  .how{grid-template-columns:minmax(0,1fr);gap:14px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .opts.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt{min-height:72px}
  .eval{grid-template-columns:minmax(0,1fr)}
  .eval img{max-width:220px}
  .rrow{grid-template-columns:minmax(0,1fr) 3rem;row-gap:4px}
  .rrow .rn{grid-column:1/-1}
  .stats{gap:8px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ---------- Sonido ---------- */
var ac=null, soundOn=store.get(KEYS.snd)!=='0';
function tone(f,t0,d,type,vol){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}

/* ---------- Cronómetro ---------- */
var raf=0,tEnd=0,tLen=1,onTimeout=null;
function stopTimer(){cancelAnimationFrame(raf);raf=0;onTimeout=null;}
function remaining(){return S&&S.calm?0:Math.max(0,Math.min(1,(tEnd-performance.now())/tLen));}
function startTimer(sec,cb){
  stopTimer(); if(S.calm)return;
  tLen=sec*1000;tEnd=performance.now()+tLen;onTimeout=cb;
  var fill=document.getElementById('tfill'),num=document.getElementById('tnum'),last=-1;
  function step(now){
    var left=Math.max(0,tEnd-now),f=left/tLen,s=Math.ceil(left/1000);
    if(fill){fill.style.transform='scaleX('+f+')';fill.classList.toggle('low',f<.3);}
    if(num&&s!==last){num.textContent=s;last=s;if(s<=3&&s>0)sfx.tick();}
    if(left<=0){raf=0;var cb2=onTimeout;onTimeout=null;if(cb2)cb2();return;}
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}

/* ---------- Ranking (opcional, usa la base compartida si está disponible) ---------- */
var DBH=null,rank=[],rankState='loading';
function paintRank(){
  var el=document.getElementById('rank'); if(!el)return;
  el.textContent='';
  var best=Number(store.get(KEYS.best))||0;
  function msg(t){var p=document.createElement('p');p.className='rk-msg';p.textContent=t;el.appendChild(p);}
  if(rankState==='loading'){msg('Cargando ranking…');return;}
  if(rankState==='slow'){msg('El ranking tarda en responder. Puedes jugar igual.');return;}
  if(rankState==='off'||rankState==='error'){
    msg(rankState==='off'?'El ranking compartido no está disponible en este enlace.':'No se pudo cargar el ranking.');
    if(best)msg('Tu mejor puntaje en este dispositivo: '+fmt(best));
    return;
  }
  if(!rank.length){msg('Aún no hay puntajes. Sé la primera persona en el ranking.');return;}
  var ol=document.createElement('ol');ol.className='rk';
  rank.forEach(function(r,i){
    var li=document.createElement('li');if(r.id===dev)li.className='me';
    var a=document.createElement('span');a.className='pos';a.textContent=String(i+1);
    var b=document.createElement('span');b.className='nm';b.textContent=String(r.name||'Anónimo').slice(0,24);
    var c=document.createElement('span');c.className='pt';c.textContent=fmt(Number(r.score)||0);
    li.appendChild(a);li.appendChild(b);li.appendChild(c);ol.appendChild(li);
  });
  el.appendChild(ol);
}
function initDb(){
  var use=window.claude&&window.claude.use;
  if(!use){rankState='off';paintRank();return;}
  var to=setTimeout(function(){if(rankState==='loading'){rankState='slow';paintRank();}},10000);
  Promise.resolve(window.claude.use('db')).then(function(db){
    if(!db){clearTimeout(to);rankState='off';paintRank();return;}
    DBH=db;
    db.collection('ranking').orderBy('score','desc').limit(10).onSnapshot(function(snap){
      clearTimeout(to);
      rank=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      rankState='ready';paintRank();
    },function(){clearTimeout(to);rankState='error';paintRank();});
    return Promise.resolve(window.claude.use('user')).then(function(u){
      if(!u)return;
      return Promise.resolve(u.canEdit&&u.canEdit()).then(function(a){ADMIN=!!a;return u.id&&u.id();}).then(function(id){UID=id||null;paintAdmin();});

function settle(c,ok,rem,mistakes){
  var pts=0,sb=0;
  if(ok){
    var isO=!(c.type==='quiz'||c.type==='tf');
    var base=isO?700:600;
    var bonus=S.calm?(isO?100:200):Math.round((isO?300:400)*rem);
    pts=Math.max(200,base+bonus-(mistakes||0)*120);
    S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    sb=S.streak>=2?Math.min(S.streak-1,3)*100:0;
    pts+=sb;S.ok++;S.byRound[c.ri].ok++;
  }else{S.streak=0;}
  S.log.push([c.ri+'-'+c.ci,ok?1:0,S.pick!==undefined?S.pick:(ok?'errores:'+(mistakes||0):'no completó')]);S.pick=undefined;
  S.score+=pts;S.byRound[c.ri].n++;S.byRound[c.ri].pts+=pts;
  hud(true);
  return {pts:pts,sb:sb};
}

function revealHTML(c,ok,res,timeout,answerLine){
  var last=S.g===TOTAL-1,newRound=!last&&FLAT[S.g+1].ri!==c.ri;
  var head=ok?pick(['¡Exacto!','¡Eso es!','¡Muy bien!','¡Así se hace!']):(timeout?'Se acabó el tiempo':pick(['Casi','Esta vez no','Buen intento']));
  return '<div class="reveal '+(ok?'good':'miss')+'" role="status">'+
    '<div class="rv-top"><strong>'+head+'</strong><span class="pts">+'+fmt(res.pts)+'</span></div>'+
    (res.sb?'<p class="bonus">Incluye +'+res.sb+' por racha</p>':'')+
    (answerLine?'<p class="answer-line">'+answerLine+'</p>':'')+
    '<p class="why">'+esc(c.why)+'</p>'+
    '<button class="btn" id="next" type="button">'+(last?'Ver mi resultado':newRound?'Siguiente ronda':'Siguiente')+'</button></div>';
}
function mountReveal(html,ok){

  var nx=document.getElementById('next');
  nx.addEventListener('click',nextStep);
  try{nx.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});}catch(e){}
  nx.focus({preventScroll:true});
}
function nextStep(){
  var prevRi=FLAT[S.g].ri;

  if(S.g>=TOTAL)return endGame();
  if(FLAT[S.g].ri!==prevRi)pushResults(false);

}

  stopTimer();var c=FLAT[S.g];hud(true);toTop();

  if(c.type==='match')return showMatch(c);
  if(c.type==='hotspot')return showHotspot(c);

  if(c.type==='type')return showType(c);
  var isTF=c.type==='tf';
  c.o=isTF?[{t:'Verdadero',ok:c.a===true},{t:'Falso',ok:c.a===false}]:shuffle(c.opts.map(function(t,i){return {t:t,ok:i===c.a};}));
  var btns=c.o.map(function(o,i){
    var cls=isTF?(i===0?'o1':'o4'):'o'+(i+1);

  }).join('');

    });

  }
  els.forEach(function(b,i){b.addEventListener('click',function(){
    if(locked)return;locked=true;
    var rem=remaining();stopTimer();
    var ok=c.o[i].ok;mark(i);S.pick=c.o[i].t;

function showMatch(c){
  var n=c.pairs.length;
  var L=c.pairs.map(function(p,k){return {t:p[0],k:k};}),R=shuffle(c.pairs.map(function(p,k){return {t:p[1],k:k};}));
  function col(list,side){return '<div class="mcol">'+list.map(function(x){return '<button class="mbtn" type="button" data-s="'+side+'" data-k="'+x.k+'">'+esc(x.t)+'</button>';}).join('')+'</div>';}

    if(sel.getAttribute('data-k')===b.getAttribute('data-k')){

function showHotspot(c){
  stage.innerHTML=metaHTML(c)+qHTML(c)+'<div class="scene" id="scn">'+SCENE+'</div>'+
    '<p class="found"><b id="fc">0</b> de '+HAZ.length+' peligros encontrados</p><ul class="flist" id="fl"></ul>';
  var svg=stage.querySelector('svg'),NS='http://www.w3.org/2000/svg',got={},n=0,mistakes=0,locked=false,fl=document.getElementById('fl');
  function ring(h,color,label){

    var ci=document.createElementNS(NS,'circle');ci.setAttribute('cx',z[0]);ci.setAttribute('cy',z[1]);ci.setAttribute('r',z[2]*.72);ci.setAttribute('fill',color+'33');ci.setAttribute('stroke',color);ci.setAttribute('stroke-width','6');
    var tx=document.createElementNS(NS,'text');tx.setAttribute('x',z[0]);tx.setAttribute('y',z[1]+9);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','28');tx.setAttribute('font-weight','800');tx.setAttribute('fill',color);tx.textContent=label;

    }else if(e&&e.clientX!==undefined&&e.type==='click'&&e.detail>0){
      mistakes++;sfx.bad();
      try{var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(svg.getScreenCTM().inverse());
        var x=document.createElementNS(NS,'text');x.setAttribute('x',p.x);x.setAttribute('y',p.y+10);x.setAttribute('text-anchor','middle');x.setAttribute('font-size','30');x.setAttribute('font-weight','800');x.setAttribute('fill','#b3372a');x.textContent='✗';x.style.pointerEvents='none';svg.appendChild(x);setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x);},700);}catch(err){}
    }
  }
  svg.addEventListener('click',function(e){hit(e.target,e);});
  svg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(e.target,e);}});
  startTimer(c.t,function(){
    if(locked)return;locked=true;
    var miss=[];HAZ.forEach(function(h,i){if(!got[i]){ring(i,'#b3372a','!');addLi(i);miss.push(h.n);}});
    multiTimeout(c,'Te faltaron: '+esc(miss.join(', '))+'.');
  });
}

/* ---------- Panel del administrador ---------- */
var ADMIN=false,UID=null,RES=[],resState='loading',resUnsub=null;
function mk(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function paintAdmin(){
  var el=document.getElementById('adminbar');if(!el)return;
  el.textContent='';if(!ADMIN)return;
  var b=mk('button','btn ghost','Panel del administrador');b.type='button';b.addEventListener('click',showAdmin);el.appendChild(b);
}
function showAdmin(){
  stopTimer();hud(false);toTop();
  stage.innerHTML='<section class="adm"><div class="adm-top"><h2>Resultados de la inducción</h2><button class="btn ghost" id="admback" type="button">Volver</button></div><div id="admbody"></div></section>';
  document.getElementById('admback').addEventListener('click',showIntro);
  paintAdminBody();
  if(!resUnsub&&DBH){
    resUnsub=DBH.collection('resultados').onSnapshot(function(snap){
      RES=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});resState='ready';paintAdminBody();
    },function(){resState='error';paintAdminBody();});
  }
}
function qInfo(key){
  var p=String(key).split('-'),r=ROUNDS[Number(p[0])],c=r&&r.ch[Number(p[1])];
  return {q:c?c.q:String(key),type:c?c.type:'',round:r?r.name:''};
}
function detailText(d){
  if(typeof d==='string'&&d.indexOf('errores:')===0){var n=Number(d.slice(8))||0;return n?'Lo completó con '+n+(n===1?' error':' errores'):'Lo completó sin errores';}
  if(d==='no completó')return 'No lo completó';
  return 'Respondió: '+String(d);
}
function paintAdminBody(){
  var body=document.getElementById('admbody');if(!body)return;
  body.textContent='';
  if(resState==='loading'){body.appendChild(mk('p','rk-msg','Cargando resultados…'));return;}
  if(resState==='error'){body.appendChild(mk('p','rk-msg','No se pudieron cargar los resultados. Solo las cuentas con permiso de editor pueden verlos.'));return;}
  if(!RES.length){body.appendChild(mk('p','rk-msg','Aún no hay resultados. Aparecerán aquí cuando alguien termine su primera ronda.'));return;}
  var fin=RES.filter(function(r){return r.final;}),avg=0;
  fin.forEach(function(r){avg+=(Number(r.ok)||0)/(Number(r.total)||TOTAL);});
  avg=fin.length?Math.round(avg/fin.length*100):0;
  var stats=mk('div','stats');
  [[RES.length,'Personas'],[fin.length,'Terminaron'],[fin.length?avg+'%':'—','Acierto promedio']].forEach(function(s){
    var d=mk('div','stat');d.appendChild(mk('b','',String(s[0])));d.appendChild(mk('span','',s[1]));stats.appendChild(d);
  });
  body.appendChild(stats);

  /* preguntas con más fallos */
  var agg={};
  RES.forEach(function(r){(Array.isArray(r.log)?r.log:[]).forEach(function(e){
    var k=e[0],a=agg[k]||(agg[k]={n:0,ok:0,wrong:{}});
    a.n++;if(e[1])a.ok++;else if(typeof e[2]==='string'&&e[2].indexOf('errores:')!==0&&e[2]!=='no completó'){a.wrong[e[2]]=(a.wrong[e[2]]||0)+1;}
  });});
  var keys=Object.keys(agg).sort(function(a,b){return agg[a].ok/agg[a].n-agg[b].ok/agg[b].n||agg[b].n-agg[a].n;});
  body.appendChild(mk('h3','adm-h','Preguntas con más fallos'));
  var list=mk('div','qlist');
  keys.forEach(function(k){
    var a=agg[k],info=qInfo(k),pct=Math.round(a.ok/a.n*100);
    var row=mk('div','qrow');
    row.appendChild(mk('div','qtxt',info.q));
    var meta=mk('div','qmeta',info.round+' · '+a.n+(a.n===1?' respuesta':' respuestas'));row.appendChild(meta);
    var bar=mk('div','rbar');var fill=mk('i');fill.style.width=pct+'%';fill.style.background=pct>=70?'var(--ok)':(pct>=40?'var(--a2)':'var(--bad)');bar.appendChild(fill);row.appendChild(bar);
    row.appendChild(mk('div','rf',pct+'%'));
    var wk=Object.keys(a.wrong).sort(function(x,y){return a.wrong[y]-a.wrong[x];})[0];
    if(wk)row.appendChild(mk('div','qwrong','Error más común: '+wk+' ('+a.wrong[wk]+')'));
    list.appendChild(row);
  });
  body.appendChild(list);

  /* personas */
  body.appendChild(mk('h3','adm-h','Personas'));
  var people=RES.slice().sort(function(a,b){return (Number(b.at)||0)-(Number(a.at)||0);});
  var pl=mk('div','plist');
  people.forEach(function(r){
    var d=document.createElement('details');d.className='person';
    var s=document.createElement('summary');
    s.appendChild(mk('b','',String(r.name||'Anónimo').slice(0,24)));
    s.appendChild(mk('span','pstate',r.final?'Terminó':'En curso ('+(Number(r.done)||0)+'/'+TOTAL+')'));
    s.appendChild(mk('span','pscore',fmt(Number(r.score)||0)+' pts · '+(Number(r.ok)||0)+'/'+(Number(r.total)||TOTAL)));
    d.appendChild(s);
    d.appendChild(mk('p','qmeta',(r.at?new Date(Number(r.at)).toLocaleString('es-CO'):'')+(r.calm?' · modo tranquilo':'')));
    var ul=mk('ul','alog');
    (Array.isArray(r.log)?r.log:[]).forEach(function(e){
      var info=qInfo(e[0]),li=mk('li',e[1]?'yes':'no');
      li.appendChild(mk('span','mark',e[1]?'✓':'✗'));
      var t=mk('span','at');t.appendChild(mk('b','',info.q));t.appendChild(mk('em','',detailText(e[2])));li.appendChild(t);
      ul.appendChild(li);
    });
    d.appendChild(ul);pl.appendChild(d);
  });
  body.appendChild(pl);
}
var saving=Promise.resolve();
function pushResults(final){
  if(!DBH||!UID||!S)return;
  if(!final&&store.get('gv_fin')==='1')return;
  var body={name:S.name,score:S.score,ok:S.ok,total:TOTAL,done:S.log.length,final:!!final,calm:S.calm?1:0,at:Date.now(),log:S.log.slice()};
  saving=saving.then(function(){return DBH.doc('resultados/'+UID).set(body);}).then(function(){if(final)store.set('gv_fin','1');}).catch(function(){});
}

/* ---------- Final ---------- */
function endGame(){
  stopTimer();hud(false);toTop();
  var pct=S.ok/TOTAL;
  var lvl=pct>=.9?['Guardián de la vida','Cuidas de todos. Gracias por tomarte en serio la seguridad.']:
          pct>=.7?['Brigadista UCO','Sabes muy bien cómo actuar. Repasa lo que se te escapó y ya estás listo.']:
          pct>=.5?['Vigía en formación','Vas por buen camino. Revisa los temas marcados abajo y vuelve a jugar.']:
                  ['Semilla de seguridad','Todo gran equipo empieza aprendiendo. Repasa los temas marcados y juega otra vez.'];
  var weakest=-1,wr=2;
  S.byRound.forEach(function(r,i){var q=r.n?r.ok/r.n:1;if(q<wr){wr=q;weakest=i;}});
  var rows=ROUNDS.map(function(r,i){
    var b=S.byRound[i],p=b.n?b.ok/b.n*100:0;
    return '<div class="rrow"><span class="rn">'+esc(r.name)+'</span><div class="rbar"><i style="width:'+p+'%;background:var(--a'+(i%4+1)+')"></i></div><span class="rf">'+b.ok+'/'+r.ch.length+'</span></div>';
  }).join('');
  var review=wr<1?'<p class="review">¡Ninguna ronda se te escapó! Tienes todo bien aprendido.</p>':
    '<p class="review">Para repasar: '+esc(ROUNDS[weakest].repaso)+'.</p>';
  stage.innerHTML=
  '<section class="end">'+
    '<div class="end-top"><span class="lvl">Tu nivel</span><h2>'+esc(lvl[0])+'</h2><div class="big-score" id="bs">0</div><p class="msg">'+esc(lvl[1])+'</p><p class="best" id="savemsg" aria-live="polite"></p></div>'+
    '<div class="stats"><div class="stat"><b>'+S.ok+'/'+TOTAL+'</b><span>Aciertos</span></div><div class="stat"><b>×'+S.bestStreak+'</b><span>Mejor racha</span></div><div class="stat"><b>'+Math.round(pct*100)+'%</b><span>Precisión</span></div></div>'+
    '<div class="rounds"><h3>Cómo te fue por ronda</h3>'+rows+review+'</div>'+
    '<div class="eval"><div><h3>Último paso</h3><p>Escanea el código con tu celular para continuar.</p></div>'+(IMG_QR?'<img src="'+IMG_QR+'" width="200" height="200" alt="Código QR">':'<div class="qr-ph" role="img" aria-label="Espacio reservado para un código QR"><span>Aquí irá el código QR</span></div>')+'</div>'+
    '<section class="rank-card" aria-labelledby="rkt2"><h2 id="rkt2">Ranking</h2><div id="rank"></div></section>'+
    '<div class="end-actions"><button class="btn big" id="again" type="button">Jugar de nuevo</button><button class="btn ghost" id="home" type="button">Volver al inicio</button></div>'+
  '</section>';
  document.getElementById('again').addEventListener('click',function(){newGame(S.name,S.calm);roundIntro();});
  document.getElementById('home').addEventListener('click',showIntro);
  paintRank();
  var el=document.getElementById('bs'),target=S.score,t0=performance.now();
  function count(now){var p=Math.min(1,(now-t0)/1100);el.textContent=fmt(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(count);}
  if(reduced)el.textContent=fmt(target);else requestAnimationFrame(count);
  if(pct>=.5){sfx.win();confetti();}
  pushResults(true);
  saveScore().then(function(){
    var m=document.getElementById('savemsg');if(!m)return;
    m.textContent={ranked:'Tu puntaje ya está en el ranking.',kept:'Tu mejor puntaje sigue en el ranking.',denied:'No se pudo publicar tu puntaje en el ranking. Con tu enlace solo puedes consultarlo.',local:'Tu mejor puntaje queda guardado en este dispositivo.'}[S.saved]||'';
    paintRank();
  });
}

/* ---------- Confeti de pétalos ---------- */
function confetti(){
  if(reduced)return;
  var cv=document.getElementById('fx'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  var cs=getComputedStyle(document.documentElement),cols=['--a1','--a2','--a3','--a4'].map(function(v){return cs.getPropertyValue(v).trim();});
  var P=[];for(var i=0;i<110;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.2,s:6+Math.random()*8,c:cols[i%4]});
  var t0=performance.now();
  (function f(now){
    var el=now-t0;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(function(p){p.x+=p.vx+Math.sin(el/400+p.r)*.6;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-el/4200);cx.beginPath();cx.ellipse(0,0,p.s,p.s*.45,0,0,6.283);cx.fill();cx.restore();});
    if(el<4200)requestAnimationFrame(f);else cx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------- Teclado ---------- */
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT')return;
  var k=e.key.toLowerCase(),opts=stage.querySelectorAll('.opt:not(:disabled)');
  if(opts.length){
    var idx=-1;
    if(/^[1-4]$/.test(k))idx=Number(k)-1;
    else if(opts.length===2&&k==='v')idx=0;
    else if(opts.length===2&&k==='f')idx=1;
    if(idx>=0&&opts[idx]){opts[idx].click();e.preventDefault();return;}
  }
  if(e.key==='Enter'&&tag!=='BUTTON'){
    var b=document.getElementById('next')||document.getElementById('go');
    if(b){b.click();e.preventDefault();}
  }
});

showIntro();
initDb();
})();
</script>
